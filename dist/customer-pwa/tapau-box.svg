    <!-- Handle Inner Cutout Slot -->
    <rect x="175" y="48" width="150" height="52" rx="26" fill="#ffffff" stroke-width="16" />

    <!-- Main Outer Body & Slanted Lid Shell -->
    <path d="M 30 200 L 125 100 L 375 100 L 470 200 L 485 200 C 495 200 500 210 500 220 L 500 520 C 500 550 475 565 440 565 L 60 565 C 25 565 0 550 0 520 L 0 220 C 0 210 5 200 15 200 Z" fill="#ff6600" stroke-width="18" />

