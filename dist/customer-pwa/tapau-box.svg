<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 570" width="100%" height="100%">
  <g stroke="#000000" stroke-linejoin="round" stroke-linecap="round">
    <!-- Left Ear Loop -->
    <path d="M 60 120 C 60 65, 80 50, 115 50 L 130 50 L 130 120 Z" fill="#ff6600" stroke-width="16" />
    <path d="M 82 105 C 80 75, 90 68, 110 68 L 120 68 L 120 105 Z" fill="#ffffff" stroke-width="12" />

    <!-- Right Ear Loop -->
    <path d="M 440 120 C 440 65, 420 50, 385 50 L 370 50 L 370 120 Z" fill="#ff6600" stroke-width="16" />
    <path d="M 418 105 C 420 75, 410 68, 390 68 L 380 68 L 380 105 Z" fill="#ffffff" stroke-width="12" />

    <!-- Center Top Handle -->
