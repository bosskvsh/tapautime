<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tapau Time - Login & Register</title>
    <meta name="theme-color" content="#ff6600">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-x-hidden">

    <div class="absolute -top-24 -right-24 w-72 h-72 bg-orange-400/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-80 h-80 bg-orange-400/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-6 relative z-10 text-center border border-stone-100 my-6">
        
        <!-- Logo -->
        <div class="w-16 h-16 bg-white border-2 border-stone-900 rounded-2xl flex items-center justify-center p-1.5 shadow-[3px_3px_0px_rgba(0,0,0,1)] mx-auto mb-4 -rotate-3">
            <img src="./icons/tapau-logo.png" alt="Tapau Time" class="w-full h-full object-contain">
        </div>

        <h1 class="text-xl font-black text-stone-800 tracking-tight" id="auth-title">Welcome to Tapau Time</h1>
        <p class="text-stone-500 text-xs mt-1 mb-5 font-semibold" id="auth-subtitle">Sign in for faster checkout & live order tracking.</p>

        <!-- Google Login -->
        <button type="button" id="google-btn" onclick="doGoogle()" class="w-full py-3 px-4 bg-white border-2 border-stone-200 hover:border-stone-400 text-stone-700 font-bold rounded-2xl flex items-center justify-center gap-3 text-sm shadow-sm mb-4 active:scale-95 transition-all cursor-pointer">
            <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <!-- Divider -->
        <div class="flex items-center gap-3 mb-4">
            <div class="flex-1 h-px bg-stone-200"></div>
            <span class="text-xs text-stone-400 font-bold uppercase tracking-wider">or with email</span>
            <div class="flex-1 h-px bg-stone-200"></div>
        </div>

        <!-- Tab Switcher -->
        <div class="bg-stone-100 p-1 rounded-2xl flex mb-4 border border-stone-200 gap-1">
            <button type="button" id="tab-signin" onclick="setMode('signin')" class="flex-1 py-2.5 text-xs font-black rounded-xl bg-white text-stone-900 shadow-sm cursor-pointer">Sign In</button>
            <button type="button" id="tab-register" onclick="setMode('register')" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-stone-500 hover:text-stone-900 cursor-pointer">Create Account</button>
        </div>

        <!-- Full Name (Register only) -->
        <div id="field-name" class="hidden text-left mb-3">
            <label class="block text-xs font-bold text-stone-700 mb-1">Full Name</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">person</span>
                <input type="text" id="auth-name" placeholder="e.g. Ahmad Faiz" class="w-full pl-9 pr-3 py-3 bg-stone-50 rounded-xl text-xs border border-stone-200 focus:outline-none focus:border-orange-400 font-semibold">
            </div>
        </div>

        <!-- Email -->
        <div class="text-left mb-3">
            <label class="block text-xs font-bold text-stone-700 mb-1">Email Address</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">mail</span>
                <input type="email" id="auth-email" placeholder="name@example.com" class="w-full pl-9 pr-3 py-3 bg-stone-50 rounded-xl text-xs border border-stone-200 focus:outline-none focus:border-orange-400 font-semibold">
            </div>
        </div>

        <!-- Password -->
        <div class="text-left mb-3">
            <label class="block text-xs font-bold text-stone-700 mb-1">Password</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">lock</span>
                <input type="password" id="auth-password" placeholder="At least 6 characters" class="w-full pl-9 pr-10 py-3 bg-stone-50 rounded-xl text-xs border border-stone-200 focus:outline-none focus:border-orange-400 font-semibold">
                <button type="button" id="pwd-toggle-btn" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 p-1 cursor-pointer">
                    <span id="pwd-icon" class="material-symbols-outlined text-[18px]">visibility</span>
                </button>
            </div>
        </div>

        <!-- Message box -->
        <div id="auth-msg" class="hidden p-3 rounded-xl text-xs font-bold mb-3 text-left"></div>

        <!-- Submit Button -->
        <button type="button" id="submit-btn" onclick="doSubmit()" class="w-full py-3.5 bg-stone-900 hover:bg-stone-800 text-white font-extrabold text-sm rounded-2xl flex items-center justify-center gap-2 shadow-sm mb-3 active:scale-95 transition-all cursor-pointer">
            <span id="submit-btn-text">Sign In with Email</span>
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>

        <!-- Toggle link -->
        <p class="text-xs text-stone-500 font-semibold mb-4">
            <span id="toggle-label">Don't have an account?</span>
            <button type="button" id="toggle-link" onclick="toggleModeLink()" class="text-orange-500 font-black underline ml-1 cursor-pointer">Create one</button>
        </p>

        <!-- Divider -->
        <div class="flex items-center gap-3 mb-4">
            <div class="flex-1 h-px bg-stone-200"></div>
            <span class="text-xs text-stone-400 font-bold uppercase tracking-wider">or</span>
            <div class="flex-1 h-px bg-stone-200"></div>
        </div>

        <!-- Guest -->
        <button type="button" id="guest-btn" onclick="doGuest()" class="w-full py-3 px-4 bg-orange-500 hover:bg-orange-600 text-white font-black rounded-2xl flex items-center justify-center gap-2 shadow-md text-sm active:scale-95 transition-all cursor-pointer">
            <span>Continue as Guest</span>
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>

        <!-- Loading overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-white/95 rounded-3xl flex-col items-center justify-center z-50 hidden">
            <span class="animate-spin inline-block w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full mb-3"></span>
            <p class="font-bold text-sm text-stone-700" id="loading-text">Please wait...</p>
        </div>
    </div>

    <script>
    var currentMode = 'signin';

    // Initialize Supabase eagerly so it can auto-detect ?code= in URL for PKCE exchange
    var sbClient = (function() {
        try {
            if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                return window.supabase.createClient(
                    'https://iaqohdvdebgxtfbxijsw.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhcW9oZHZkZWJneHRmYnhpanN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNzkyNjIsImV4cCI6MjEwMjY1NTI2Mn0.DFFY_o-wlxonj1mlHsHe3M9_ELGWtTmaqgc1iGr33WE',
                    { auth: { detectSessionInUrl: true, flowType: 'pkce', persistSession: true } }
                );
            }
        } catch (e) {
            console.warn('[Tapau] Supabase init warning:', e);
        }
        return null;
    })();

    function getSupabase() { return sbClient; }

    function setMode(mode) {
        currentMode = mode;
        var fieldName = document.getElementById('field-name');
        var submitText = document.getElementById('submit-btn-text');
        var tabSignin = document.getElementById('tab-signin');
        var tabRegister = document.getElementById('tab-register');
        var toggleLabel = document.getElementById('toggle-label');
        var toggleLink = document.getElementById('toggle-link');
        var authTitle = document.getElementById('auth-title');
        var authMsg = document.getElementById('auth-msg');

        if (authMsg) authMsg.classList.add('hidden');

        if (mode === 'register') {
            if (fieldName) fieldName.classList.remove('hidden');
            if (submitText) submitText.textContent = 'Create Account & Continue';
            if (authTitle) authTitle.textContent = 'Create an Account';
            if (tabRegister) tabRegister.className = 'flex-1 py-2.5 text-xs font-black rounded-xl bg-white text-stone-900 shadow-sm cursor-pointer';
            if (tabSignin) tabSignin.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl text-stone-500 hover:text-stone-900 cursor-pointer';
            if (toggleLabel) toggleLabel.textContent = 'Already have an account?';
            if (toggleLink) toggleLink.textContent = 'Sign in';
        } else {
            if (fieldName) fieldName.classList.add('hidden');
            if (submitText) submitText.textContent = 'Sign In with Email';
            if (authTitle) authTitle.textContent = 'Welcome to Tapau Time';
            if (tabSignin) tabSignin.className = 'flex-1 py-2.5 text-xs font-black rounded-xl bg-white text-stone-900 shadow-sm cursor-pointer';
            if (tabRegister) tabRegister.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl text-stone-500 hover:text-stone-900 cursor-pointer';
            if (toggleLabel) toggleLabel.textContent = "Don't have an account?";
            if (toggleLink) toggleLink.textContent = 'Create one';
        }
    }

    function toggleModeLink() {
        setMode(currentMode === 'signin' ? 'register' : 'signin');
    }

    function togglePassword() {
        var input = document.getElementById('auth-password');
        var icon = document.getElementById('pwd-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility';
        }
    }

    function showMsg(text, type) {
        var el = document.getElementById('auth-msg');
        if (!el) return;
        el.classList.remove('hidden');
        el.className = type === 'success'
            ? 'p-3 rounded-xl text-xs font-bold mb-3 text-left bg-emerald-50 text-emerald-700 border border-emerald-200'
            : 'p-3 rounded-xl text-xs font-bold mb-3 text-left bg-red-50 text-red-700 border border-red-200';
        el.textContent = text;
    }

    function showLoading(text) {
        var el = document.getElementById('loading-overlay');
        if (!el) return;
        el.classList.remove('hidden');
        el.classList.add('flex');
        if (text) document.getElementById('loading-text').textContent = text;
    }

    function hideLoading() {
        var el = document.getElementById('loading-overlay');
        if (!el) return;
        el.classList.add('hidden');
        el.classList.remove('flex');
    }

    function saveProfile(name, email, userId) {
        try {
            var profile = {
                name: name || (email ? email.split('@')[0] : 'Tapau Member'),
                email: email || '',
                userId: userId || null,
                savedAt: Date.now()
            };
            localStorage.setItem('tapau_user_profile', JSON.stringify(profile));
        } catch (e) {
            console.warn('[Tapau] saveProfile error:', e);
        }
    }

    var hasRedirected = false;

    function redirectToShop() {
        if (hasRedirected) return;
        hasRedirected = true;

        var isSubfolder = window.location.pathname.includes('tapau_time_ordering');
        var destination = isSubfolder ? 'index.html' : 'order.html';
        var cleanPath;
        if (window.location.pathname.includes('customer_login.html')) {
            cleanPath = window.location.pathname.replace(/customer_login\.html.*/, destination);
        } else {
            cleanPath = window.location.pathname.endsWith('/')
                ? window.location.pathname + destination
                : window.location.pathname + '/' + destination;
        }
        var target = window.location.origin + cleanPath;
        window.location.replace(target);
    }

    async function resendConfirmationEmail(email) {
        var sb = getSupabase();
        if (!sb || !email) {
            showMsg('Please enter your email address.', 'error');
            return;
        }
        showLoading('Resending confirmation email...');
        try {
            var res = await sb.auth.resend({ type: 'signup', email: email });
            hideLoading();
            if (res.error) {
                showMsg('Could not resend email: ' + res.error.message, 'error');
            } else {
                showMsg('Confirmation email resent! Please check your inbox and Spam/Junk folder.', 'success');
            }
        } catch(e) {
            hideLoading();
            showMsg('Resend failed: ' + (e.message || String(e)), 'error');
        }
    }

    async function doSubmit() {
        var emailInput = document.getElementById('auth-email');
        var passwordInput = document.getElementById('auth-password');
        var nameInput = document.getElementById('auth-name');

        var email = emailInput ? emailInput.value.trim() : '';
        var password = passwordInput ? passwordInput.value : '';
        var name = nameInput ? nameInput.value.trim() : '';

        if (currentMode === 'register' && !name) {
            showMsg('Please enter your full name.', 'error');
            return;
        }
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showMsg('Please enter a valid email address.', 'error');
            return;
        }
        if (!password || password.length < 6) {
            showMsg('Password must be at least 6 characters long.', 'error');
            return;
        }

        var submitBtn = document.getElementById('submit-btn');
        if (submitBtn) submitBtn.disabled = true;

        var displayName = name || email.split('@')[0];
        var loadingText = currentMode === 'register' ? 'Creating account...' : 'Signing in...';
        showLoading(loadingText);

        var sb = getSupabase();
        if (!sb) {
            hideLoading();
            if (submitBtn) submitBtn.disabled = false;
            showMsg('Auth service unavailable. Please try again.', 'error');
            return;
        }

        try {
            if (currentMode === 'register') {
                var signUpRes = await sb.auth.signUp({
                    email: email,
                    password: password,
                    options: { data: { full_name: displayName } }
                });

                if (signUpRes.error) {
                    // If user already exists, try to sign in instead
                    if (signUpRes.error.message.includes('User already registered') ||
                        signUpRes.error.message.includes('already been registered')) {
                        // Fall through to sign-in attempt
                    } else {
                        throw signUpRes.error;
                    }
                }

                // If signUp succeeded but session is null (email confirmation required),
                // don't redirect yet — wait for user to confirm email and sign in
                if (!signUpRes.data?.session) {
                    hideLoading();
                    if (submitBtn) submitBtn.disabled = false;
                    showMsg('Account created! Check your email (including Spam/Junk) to confirm your address. <button onclick="resendConfirmationEmail(\'' + email.replace(/'/g, "\\'") + '\')" class="underline font-bold ml-1 cursor-pointer">Resend Email</button>', 'success');
                    return;
                }

                // Session exists (email confirmation disabled or auto-confirmed)
                var u = signUpRes.data.session.user;
                displayName = u.user_metadata?.full_name || u.user_metadata?.name || displayName;
                saveProfile(displayName, email, u.id);
                hideLoading();
                if (submitBtn) submitBtn.disabled = false;
                redirectToShop();
                return;
            } else {
                // Sign in with email/password
                var signInRes = await sb.auth.signInWithPassword({ email: email, password: password });

                if (signInRes.error) {
                    throw signInRes.error;
                }

                if (!signInRes.data?.session || !signInRes.data.session.user) {
                    throw new Error('Sign in succeeded but no session returned');
                }

                var u = signInRes.data.session.user;
                displayName = u.user_metadata?.full_name || u.user_metadata?.name || displayName;
                saveProfile(displayName, email, u.id);
                hideLoading();
                if (submitBtn) submitBtn.disabled = false;
                redirectToShop();
                return;
            }
        } catch (e) {
            hideLoading();
            if (submitBtn) submitBtn.disabled = false;
            var msg = e?.message || String(e);
            // Friendly error messages
            if (msg.includes('Email not confirmed')) {
                showMsg('Please confirm your email address first. Check inbox & Spam/Junk folder. <button onclick="resendConfirmationEmail(\'' + email.replace(/'/g, "\\'") + '\')" class="underline font-bold ml-1 cursor-pointer">Resend Email</button>', 'error');
            } else if (msg.includes('Invalid login credentials') || msg.includes('Invalid email or password')) {
                showMsg('Invalid email or password. Please check your credentials.', 'error');
            } else if (msg.includes('Too many requests')) {
                showMsg('Too many attempts. Please wait a moment and try again.', 'error');
            } else {
                showMsg('Sign in failed: ' + msg, 'error');
            }
        }
    }

    async function doGoogle() {
        var sb = getSupabase();
        if (!sb) { showMsg('Google login unavailable. Please use email or continue as guest.', 'error'); return; }
        
        // Set logging-in indicator so checkAuthLanding passes upon redirect
        try {
            localStorage.setItem('tapau_logging_in', 'true');
        } catch(e) {}

        showLoading('Connecting to Google...');
        try {
            var res = await sb.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (res.error) {
                localStorage.removeItem('tapau_logging_in');
                hideLoading();
                showMsg('Google error: ' + res.error.message, 'error');
            } else if (res.data?.url) {
                // Supabase v2 returns the OAuth URL — must redirect manually
                window.location.href = res.data.url;
            }
        } catch(e) {
            localStorage.removeItem('tapau_logging_in');
            hideLoading();
            showMsg('Google sign-in failed. Please use email instead.', 'error');
        }
    }

    function doGuest() {
        localStorage.setItem('tapau_guest_session', 'true');
        redirectToShop();
    }

    function handleAuthenticatedUser(u) {
        if (!u) return;
        var email = (u.email || '').trim().toLowerCase();
        var name = (u.user_metadata?.full_name || u.user_metadata?.name || (email ? email.split('@')[0] : 'Tapau Member')).trim();
        if (email) {
            saveProfile(name, email, u.id);
        }
        try {
            localStorage.removeItem('tapau_logging_in');
        } catch(e) {}

        // Clean query/hash parameters from URL without reloading
        if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        redirectToShop();
    }

    // Session & OAuth Return Handler
    (async function initAuthHandling() {
        var params = new URLSearchParams(window.location.search);
        var hash = window.location.hash;

        // Handle explicit logout
        if (params.get('logout') === '1' || params.get('force') === '1') {
            localStorage.removeItem('tapau_user_profile');
            localStorage.removeItem('tapau_guest_session');
            localStorage.removeItem('tapau_logging_in');
            if (sbClient) sbClient.auth.signOut().catch(function(){});
            if (window.history && window.history.replaceState) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            return;
        }

        // Show error from OAuth provider
        var errorMsg = params.get('error_description') || params.get('error') ||
                       (hash.includes('error_description=') ? decodeURIComponent(hash.split('error_description=')[1].split('&')[0]) : null);
        if (errorMsg) {
            localStorage.removeItem('tapau_logging_in');
            if (window.history && window.history.replaceState) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            showMsg('Login failed: ' + errorMsg.replace(/\+/g, ' '), 'error');
            return;
        }

        var isOAuthReturn = params.has('code') || hash.includes('access_token');
        if (isOAuthReturn) showLoading('Completing Google Sign In...');

        if (sbClient) {
            // 1. Reactive listener: Handles SIGNED_IN, INITIAL_SESSION, TOKEN_REFRESHED
            sbClient.auth.onAuthStateChange(function(event, session) {
                console.log('[Tapau] Auth event:', event, session ? session.user.email : 'no session');
                if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION') && session && session.user) {
                    handleAuthenticatedUser(session.user);
                } else if (isOAuthReturn && event === 'SIGNED_OUT') {
                    localStorage.removeItem('tapau_logging_in');
                    hideLoading();
                    showMsg('Sign-in was cancelled or failed. Please try again.', 'error');
                }
            });

            // 2. Immediate check for existing valid session
            try {
                var initialResult = await sbClient.auth.getSession();
                if (initialResult.data && initialResult.data.session && initialResult.data.session.user) {
                    handleAuthenticatedUser(initialResult.data.session.user);
                    return;
                }
            } catch (e) {
                console.warn('[Tapau] Initial getSession error:', e);
            }

            // 3. If returning from OAuth (PKCE code or access token in URL), allow Supabase detectSessionInUrl to complete
            if (isOAuthReturn) {
                var sessionFound = false;
                var attempts = 0;
                var maxAttempts = 15; // 3 seconds maximum (15 x 200ms)

                while (attempts < maxAttempts && !sessionFound) {
                    await new Promise(function(resolve) { setTimeout(resolve, 200); });
                    attempts++;
                    try {
                        var pollResult = await sbClient.auth.getSession();
                        if (pollResult.data && pollResult.data.session && pollResult.data.session.user) {
                            sessionFound = true;
                            handleAuthenticatedUser(pollResult.data.session.user);
                            return;
                        }
                    } catch (e) {}
                }

                // Fallback: If detectSessionInUrl didn't exchange the code, try explicit exchange
                if (!sessionFound && params.has('code')) {
                    try {
                        var code = params.get('code');
                        var exchangeRes = await sbClient.auth.exchangeCodeForSession(code);
                        if (exchangeRes.data && exchangeRes.data.session && exchangeRes.data.session.user) {
                            sessionFound = true;
                            handleAuthenticatedUser(exchangeRes.data.session.user);
                            return;
                        }
                    } catch (e) {
                        console.warn('[Tapau] PKCE exchangeCodeForSession fallback notice:', e);
                    }
                }

                // Final post-poll check
                if (!sessionFound) {
                    try {
                        var finalCheck = await sbClient.auth.getSession();
                        if (finalCheck.data && finalCheck.data.session && finalCheck.data.session.user) {
                            handleAuthenticatedUser(finalCheck.data.session.user);
                            return;
                        }
                    } catch (e) {}

                    hideLoading();
                    if (window.history && window.history.replaceState) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                    showMsg('Google sign-in could not establish a session. Please try again or continue as guest.', 'error');
                }
            } else {
                // Not an OAuth return — check guest session
                var isGuest = localStorage.getItem('tapau_guest_session') === 'true';
                if (isGuest) {
                    redirectToShop();
                }
            }
        } else {
            hideLoading();
        }
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) { reg.update(); console.log('[PWA Login SW] Registered scope:', reg.scope); })
          .catch(function(err) { console.warn('[PWA Login SW] Registration failed:', err); });
      });
    }
    })();
    </script>
</body>
</html>
